name: Lint with Black

on:
  push:
    branches: [ main ]
    paths:
      - '*.py'
      - '**/*.py'
  pull_request:
    branches: [ main ]
    paths:
      - '*.py'
      - '**/*.py'

jobs:
  black:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: psf/black@stable

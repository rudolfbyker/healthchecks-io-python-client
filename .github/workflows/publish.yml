name: Build and upload wheels

on:
  release:
    types: [created]

jobs:
  pypi-publish:
    timeout-minutes: 20

    runs-on: ubuntu-latest
    
    permissions:
      # See https://docs.pypi.org/trusted-publishers/using-a-publisher/
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel twine build

      - name: Build
        env:
          TWINE_PASSWORD: ${{ secrets.PUBLIC_PYPI_PASSWORD }}
        run: python -m build

      - name: Upload artifact to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl

      - name: Publish to AA's private Pypi repository
        env:
          TWINE_USERNAME: 'aa'
          TWINE_PASSWORD: ${{ secrets.AA_PYPI_PASSWORD }}
          TWINE_REPOSITORY_URL: 'https://pypi.autoactuary.com'
        run: twine upload dist/*.whl

      # TODO: Publish to RSC's private Pypi repository (we don't have one yet).

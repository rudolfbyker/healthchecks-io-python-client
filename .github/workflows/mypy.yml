name: Lint with MyPy

on:
  push:
    branches: [ main ]
    paths:
      - '*.py'
      - '**/*.py'
  pull_request:
    branches: [ main ]
    paths:
      - '*.py'
      - '**/*.py'

jobs:
  mypy:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c ci-constraints.txt . -r mypy-requirements.txt

      - name: Run MyPy
        run: |
          mypy .
